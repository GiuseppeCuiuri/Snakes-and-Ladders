name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ["21", "25"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and check
        # Tests, coverage gate, Checkstyle and SpotBugs run everywhere. Formatting does not depend
        # on the platform, so Spotless runs once, on Linux with Java 21.
        run: >-
          ./mvnw -B -ntp verify
          ${{ (matrix.os != 'ubuntu-latest' || matrix.java != '21') && '-Dspotless.check.skip=true' || '' }}

  coverage-badge:
    name: Coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two quick pushes would otherwise race to update the branch; the newer one is what counts.
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run the tests with coverage
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true -Dcheckstyle.skip -Dspotbugs.skip
      - name: Keep only the domain package, the one the coverage gate checks
        run: |
          csv=target/site/jacoco/jacoco.csv
          { head -n 1 "$csv"; grep ',io\.github\.giuseppecuiuri\.snakesandladders\.domain,' "$csv"; } \
            > domain-coverage.csv
      - name: Draw the badge from the JaCoCo report
        uses: cicirello/jacoco-badge-generator@v2.12.1
        with:
          jacoco-csv-file: domain-coverage.csv
          coverage-label: domain coverage
          badges-directory: badges
          coverage-badge-filename: jacoco.svg
      - name: Publish it on the badges branch
        # A separate branch keeps these automatic commits out of the history of main.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach ../badges-worktree
          cd ../badges-worktree
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth 1 origin badges
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$GITHUB_WORKSPACE/badges/jacoco.svg" jacoco.svg
          git add jacoco.svg
          git diff --cached --quiet || git commit -m "Update the coverage badge"
          git push origin badges
