name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    # Code scanning is free for public repositories only: while the repository is private this job
    # is skipped instead of failing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build
        run: ./mvnw -B -ntp package -DskipTests -Djacoco.skip=true -Dspotless.check.skip=true -Dcheckstyle.skip -Dspotbugs.skip
      - uses: github/codeql-action/analyze@v4
